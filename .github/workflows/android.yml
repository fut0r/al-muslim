name: Android

# Builds the Android app on every push that touches it and uploads the APK.
# Pushing a version tag (for example v2.0.0) also publishes a GitHub release.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of the certificate that releases are signed with (CN=Zyad Mohamed).
  # It is public. A release build signed with any other key is rejected.
  RELEASE_CERTIFICATE_SHA256: ee546b4be0ffed2fc2b1f102e2d17d38d54bc203c8df0a93dad94c6e431a22a0

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Optional. With these repository secrets the release build is signed
      # with the developer's own key, so every build installs over the one
      # before it. Without them (a fork, say) it is left unsigned and only the
      # debug APK is uploaded. See the README.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the web app and copy it into the Android project
        run: npm run android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The release build is assembled on every push, so that a problem that
      # only shows there is caught here and not when a version is tagged.
      - name: Assemble the debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          fi
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Check that the release APK is signed with the developer's key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certificates="$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          echo "$certificates"
          if ! echo "$certificates" | grep -qi "SHA-256 digest: $RELEASE_CERTIFICATE_SHA256"; then
            echo "::error::The release APK is not signed with the expected certificate"
            exit 1
          fi

      # Prayer notifications and background recitation depend on these, so
      # check what the finished APK really declares.
      - name: Check the permissions the APK declares
        run: |
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          permissions="$("$aapt2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk)"
          echo "$permissions"
          for name in INTERNET POST_NOTIFICATIONS USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED FOREGROUND_SERVICE_MEDIA_PLAYBACK; do
            if ! echo "$permissions" | grep -q "android.permission.$name"; then
              echo "::error::The APK does not declare android.permission.$name"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: al-muslim-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Signed with the developer's key: installs over any earlier signed build.
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: al-muslim-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional. With these repository secrets the release APK is signed with
      # your own key, so later versions install as updates. Without them a
      # debug-signed APK is published instead. See the README.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the web app and copy it into the Android project
        run: npm run android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/al-muslim-$GITHUB_REF_NAME.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/al-muslim-$GITHUB_REF_NAME-debug.apk"
          fi

      - name: Check that the release APK is signed with the developer's key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certificates="$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          echo "$certificates"
          if ! echo "$certificates" | grep -qi "SHA-256 digest: $RELEASE_CERTIFICATE_SHA256"; then
            echo "::error::The release APK is not signed with the expected certificate"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/al-muslim-*.apk --title "Al-Muslim $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/al-muslim-*.apk --title "Al-Muslim $GITHUB_REF_NAME" --generate-notes
          fi
