name: Website

# Builds the landing page with the web app under /app/ and publishes both to
# GitHub Pages. Publishing only happens once Pages is enabled for the
# repository (Settings → Pages → Source: GitHub Actions); until then the site
# is still built, so mistakes are caught.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To see whether GitHub's own Pages build of the same commit is still running.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the web app
        run: npx vite build

      - name: Build the landing page around it
        run: npm run site

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The site was built but not published: GitHub Pages is not enabled. Enable it under Settings → Pages with the source set to GitHub Actions."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist-site

  deploy:
    name: Publish
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # With Pages set to "Deploy from a branch", GitHub also publishes the
      # repository as it is on every push, and whichever deployment ends last
      # is the one that stays online. Wait for that one, so that the built site
      # is what visitors get. With the source set to "GitHub Actions" there is
      # nothing to wait for.
      - name: Wait for GitHub's own Pages deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            pending="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50"               --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')"
            if [ "$pending" = "0" ]; then
              break
            fi
            echo "The branch deployment is still running; waiting ($attempt)."
            sleep 15
          done

      - id: deployment
        uses: actions/deploy-pages@v4
